<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#42218c">
<meta name="description" content="Parlem! Aprende catalán desde el castellano jugando.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./parlem-redesign.css?v=20261121-full-redesign">
<title>Parlem! · Aprende catalán</title>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="hero-copy">
    <h1>Parlem!</h1>
    <p>Aprende catalán desde el castellano</p>
  </div>
  <img class="mascot" src="./mascot-juggling-hires.webp?v=20261121-full-redesign"
       width="480" height="640" loading="eager" decoding="async"
       alt="Niña con coleta oscura haciendo toques con un balón de fútbol con una equipación blaugrana">
</header>
<div id="auth" class="card">
  <h2>Cuenta familiar</h2>
  <input id="email" type="email" autocomplete="email" placeholder="Correo electrónico">
  <input id="pass" type="password" autocomplete="current-password" placeholder="Contraseña (mínimo 8 caracteres)">
  <p><button id="login">Entrar</button><button id="signup">Crear cuenta</button></p>
  <p id="message" class="muted"></p>
</div>
<div id="home" class="hidden">
  <div class="card profile-card">
    <button id="logout">Cerrar sesión</button>
    <h2>¿Quién aprende hoy?</h2>
    <div id="profiles"></div>
    <div class="profile-entry">
      <input id="name" placeholder="Nombre del alumno" aria-label="Nombre del alumno">
      <select id="mode" aria-label="Tipo de perfil">
        <option value="child">Niño/a</option>
        <option value="adult">Adulto</option>
      </select>
      <button id="add">Añadir perfil</button>
    </div>
  </div>
  <div id="dashboard" class="card hidden">
    <h2 id="welcome"></h2>
    <p id="stats"></p>
    <h3>Curso guiado · Unidad 1: Hola!</h3>
    <div id="lessons"></div>
    <h3>Bibliotecas de práctica</h3>
    <button id="library">📚 Repasar vocabulario y frases</button>
  </div>
  <div id="game" class="card hidden">
    <button id="back">← Volver</button>
    <h2 id="title"></h2>
    <div class="bar"><div id="bar"></div></div>
    <p id="count"></p>
    <h2 id="prompt"></h2>
    <button id="hear">🔊 Escuchar</button>
    <button id="slow">🐢 Lento</button>
    <div id="options"></div>
    <p id="feedback"></p>
    <button id="next" class="hidden">Continuar</button>
  </div>
</div>
<p class="muted footer-note">Parlem! · Aprende catalán jugando.</p>
</div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';
const db=createClient('https://yzrrerwlkxbsipknjjjn.supabase.co','sb_publishable_7SURR9UWHYqdRo4OhLt4GQ_yYijr3VV');
const el=x=>document.getElementById(x),vis=(x,v)=>el(x).classList.toggle('hidden',!v);
let user,profiles=[],active,progress=[],bank=[],index=0,correct=0,lesson='';
const lessons=[['u1-l1','Hola! Com estàs?'],['u1-l2','Com et dius?'],['u1-l3','Jo soc…'],['u1-l4','D’on ets?'],['u1-l5','Parlem!'],['u1-l6','El repte final']];
const cards=[['Hola!','Hola','Adiós','Gracias',1],['Bon dia','Buenos días','Buenas noches','Buenas tardes',1],['Bona tarda','Buenas tardes','Buenos días','Buenas noches',1],['Bona nit','Buenas noches','Buenos días','Gracias',1],['Adeu','Adiós','Hola','Gracias',1],['Gràcies','Gracias','Por favor','Adiós',1],['Com et dius?','¿Cómo te llamas?','¿Cómo estás?','¿De dónde eres?',2],['Em dic Laia','Me llamo Laia','Soy Laia','Estoy bien',2],['I tu?','¿Y tú?','¿Quién?','¿Dónde?',2],['Es diu Marc','Se llama Marc','Soy Marc','Eres Marc',2],['Jo soc de Barcelona','Soy de Barcelona','Estoy en Barcelona','Voy a Barcelona',3],['Tu ets la Marta','Tú eres Marta','Ella es Marta','Yo soy Marta',3],['Ella és de Catalunya','Ella es de Cataluña','Ella está en Cataluña','Ella va a Cataluña',3],['Nosaltres som amics','Somos amigos','Sois amigos','Son amigos',3],['D’on ets?','¿De dónde eres?','¿Cómo estás?','¿Cómo te llamas?',4],['Soc d’aquí','Soy de aquí','Estoy aquí','Vivo aquí',4],['Soc d’Espanya','Soy de España','Voy a España','Estoy en España',4],['Catalunya','Cataluña','España','Barcelona',4],['Com estàs?','¿Cómo estás?','¿Cómo te llamas?','¿Quién eres?',5],['Estic bé','Estoy bien','Soy bueno','Tengo hambre',5],['Fins demà','Hasta mañana','Hasta pronto','Buenas noches',5],['Si us plau','Por favor','Gracias','De nada',5],['Parles català?','¿Hablas catalán?','¿Eres catalán?','¿Vives en Cataluña?',5]];
const speak=(text,slow=false)=>{if(!('speechSynthesis'in window)){alert('Este dispositivo no admite reproducción de voz.');return;}const voices=speechSynthesis.getVoices();const voice=voices.find(v=>/^ca(?:-|$)/i.test(v.lang))||voices.find(v=>/^es-ES$/i.test(v.lang))||voices.find(v=>/^es(?:-|$)/i.test(v.lang));if(!voice){alert('No hay una voz catalana ni española disponible en este dispositivo.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voice.lang;u.voice=voice;u.rate=slow?0.7:0.9;speechSynthesis.speak(u)};
async function refresh(){const r=await db.auth.getUser();user=r.data.user;vis('auth',!user);vis('home',!!user);if(!user)return;const q=await db.from('learner_profiles').select('*').order('created_at');if(q.error){el('message').textContent=q.error.message;return}profiles=q.data;active=profiles.find(p=>p.id===active?.id)||profiles[0];el('profiles').replaceChildren(...profiles.map(p=>{const b=document.createElement('button');b.textContent=(p.mode==='child'?'⭐ ':'👤 ')+p.display_name;b.onclick=()=>{active=p;dashboard()};return b}));await dashboard()}
async function dashboard(){vis('dashboard',!!active);vis('game',false);if(!active)return;const q=await db.from('lesson_progress').select('*').eq('learner_id',active.id);progress=q.data||[];el('welcome').textContent='¡Hola, '+active.display_name+'!';el('stats').textContent=progress.reduce((a,p)=>a+p.xp,0)+' XP · '+progress.filter(p=>p.completed).length+' lecciones completadas';el('lessons').replaceChildren(...lessons.map(([id,label])=>{const b=document.createElement('button');b.textContent=label+(progress.some(p=>p.lesson_id===id&&p.completed)?' ✓':'');b.onclick=()=>start(id);return b}))}
function start(id){lesson=id;bank=cards.filter(q=>id==='u1-l6'||q[4]===Number(id.slice(-1))).sort(()=>Math.random()-.5);index=0;correct=0;vis('dashboard',false);vis('game',true);el('title').textContent=lessons.find(l=>l[0]===id)?.[1]||'Repaso';draw()}
function draw(){const q=bank[index];el('bar').style.width=(index/bank.length*100)+'%';el('count').textContent=(index+1)+' / '+bank.length;el('prompt').textContent=q[0];el('feedback').textContent='';vis('next',false);el('options').replaceChildren(...q.slice(1,4).sort(()=>Math.random()-.5).map(a=>{const b=document.createElement('button');b.className='option';b.textContent=a;b.onclick=()=>{const yes=a===q[1];if(yes)correct++;el('feedback').textContent=yes?'¡Correcto!':'Respuesta: '+q[1];el('options').querySelectorAll('button').forEach(x=>x.disabled=true);vis('next',true)};return b}));speak(q[0])}
async function finish(){el('prompt').textContent='¡Lección terminada!';el('options').replaceChildren();el('feedback').textContent='Guardando progreso…';vis('next',false);const old=progress.find(p=>p.lesson_id===lesson);const pct=Math.round(correct/bank.length*100);const q=await db.from('lesson_progress').upsert({owner_id:user.id,learner_id:active.id,lesson_id:lesson,completed:true,best_score:Math.max(pct,old?.best_score||0),xp:(old?.xp||0)+correct*10,attempts:(old?.attempts||0)+1,updated_at:new Date().toISOString()},{onConflict:'learner_id,lesson_id'});el('feedback').textContent=q.error?'Error al guardar: '+q.error.message:'☁️ Guardado en Supabase: '+correct+' / '+bank.length;el('next').textContent='Volver al curso';vis('next',true);el('next').onclick=()=>{el('next').onclick=advance;dashboard()}}
function advance(){if(index<bank.length-1){index++;draw()}else finish()}
el('next').onclick=advance;el('back').onclick=dashboard;el('hear').onclick=()=>speak(bank[index][0]);el('slow').onclick=()=>speak(bank[index][0],true);el('library').onclick=()=>start('u1-l6');
el('login').onclick=async()=>{const r=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('pass').value});el('message').textContent=r.error?.message||'';if(!r.error)refresh()};
el('signup').onclick=async()=>{const r=await db.auth.signUp({email:el('email').value.trim(),password:el('pass').value});el('message').textContent=r.error?.message||'Cuenta creada. Revisa tu correo para confirmar la dirección.';if(r.data.session)refresh()};
el('logout').onclick=async()=>{await db.auth.signOut();active=null;refresh()};
el('add').onclick=async()=>{const name=el('name').value.trim();if(!name)return;const r=await db.from('learner_profiles').insert({owner_id:user.id,display_name:name,mode:el('mode').value});if(r.error)alert(r.error.message);else{el('name').value='';refresh()}};
db.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
